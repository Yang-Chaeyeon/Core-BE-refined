spring:
  application:
    name: core-banking
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # @QueryHint lock.timeout은 MySQL에서 무시되므로 세션 변수로 락 대기 시간을 제한 (앱 전체 락 대기에 적용됨)
      connection-init-sql: "SET SESSION innodb_lock_wait_timeout = 3"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000

scheduler:
  remittance:
    monthly-cron: "0 0 1 * * *"
    weekly-cron: "0 0 3 * * MON-FRI"

exchange:
  auth-key: ${EX_API_KEY}

management:
  endpoint:
    info:
      access: read_only
    health:
      access: read_only
    metrics:
      access: read_only
    prometheus:
      access: read_only
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: core-banking

server:
  port: ${SERVER_PORT:8090}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.hibernate.sql: DEBUG

core:
  account-lock:
    account-lock-prefix: ${ACCOUNT_LOCK_PREFIX}
    wait-millis: ${ACCOUNT_LOCK_WAIT_MILLIS}
    lease-millis: ${ACCOUNT_LOCK_LEASE_MILLIS}
